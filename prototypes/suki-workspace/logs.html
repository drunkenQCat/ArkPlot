<!doctype html><html lang="zh-CN" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ArkPlot · 日志原型</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="panels.css"></head><body><div class="prototype-bar"><span>运行日志原型 · 示例记录</span><div><a href="index.html">主界面</a><a href="settings.html">设置</a><button id="theme" class="icon-button" aria-label="切换主题"><i data-icon="weather-night"></i></button></div></div><main class="window panel-window"><header class="panel-title"><span class="icon-tile"><i data-icon="file-document-outline"></i></span><div><h1>运行日志</h1><p>孤星 · 小说生成</p></div><span class="status-pill warning">部分失败 · 已保留结果</span></header><div class="log-layout"><aside class="glass log-stages"><h3>处理阶段</h3><p class="intro">点击阶段查看对应记录</p><button data-stage="all" class="stage-filter active"><i data-icon="file-document-outline"></i><span>全部记录</span><small>7</small></button><button data-stage="download" class="stage-filter"><i data-icon="check"></i><span>获取剧情</span><small>完成</small></button><button data-stage="script" class="stage-filter"><i data-icon="check"></i><span>整理剧本</span><small>完成</small></button><button data-stage="novel" class="stage-filter"><i data-icon="alert-circle-outline"></i><span>小说生成</span><small>1 错误</small></button><button data-stage="export" class="stage-filter"><i data-icon="check"></i><span>导出文件</span><small>完成</small></button></aside><section class="glass log-main"><div class="issue-callout"><i data-icon="alert-circle-outline"></i><div><b>1 章生成失败，其余结果已保存</b><p>CW-2 行动后 · 请求超时</p></div><button class="text-button" id="locate">定位记录</button></div><div class="log-toolbar"><label><input type="checkbox" id="errors-only"> 仅错误</label><label><input type="checkbox" id="follow" checked> 跟随最新</label><button class="text-button" id="export-log">导出日志</button></div><div id="log-entries"></div><div class="log-bottom"><span id="log-count"></span><span>点击记录展开详情</span></div></section></div></main><div class="toast" id="toast" hidden role="status"></div><script src="icons.js"></script><script src="panels.js"></script></body></html>
